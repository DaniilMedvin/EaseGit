name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токен только на чтение: PR из форков ничего не могут изменить в репозитории.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      # Single-file сборка тоже должна собираться: её выкладывает release.yml.
      - name: Publish (linux-x64)
        run: dotnet publish LazyGit --configuration Release --runtime linux-x64 --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: lgit-linux-x64
          path: publish/lgit
